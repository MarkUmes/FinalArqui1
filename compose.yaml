name: tienda

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
      BROKER_DB_PASSWORD: ${BROKER_DB_PASSWORD:?Configura BROKER_DB_PASSWORD}
      PRODUCTOS_DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD:?Configura PRODUCTOS_DB_PASSWORD}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?Configura PEDIDOS_DB_PASSWORD}
    volumes:
      - datos:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    # El MySQL temporal que ejecuta los scripts de inicio no escucha por TCP.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 25

  broker:
    build: ./broker
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_NAME: broker
      DB_USER: broker
      DB_PASSWORD: ${BROKER_DB_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO:?Configura JWT_SECRETO}
      SERVICIO_TOKEN: ${SERVICIO_TOKEN:?Configura SERVICIO_TOKEN}
      ADMIN_USUARIO: ${ADMIN_USUARIO:?Configura ADMIN_USUARIO}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD}
      PRODUCTOS_URL: http://productos:3001
      PEDIDOS_URL: http://pedidos:3002
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  productos:
    build: ./productos
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_NAME: productos
      DB_USER: productos
      DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD}
      SERVICIO_TOKEN: ${SERVICIO_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy

  pedidos:
    build: ./pedidos
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_NAME: pedidos
      DB_USER: pedidos
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      BROKER_URL: http://broker:3000
      SERVICIO_TOKEN: ${SERVICIO_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  datos:
