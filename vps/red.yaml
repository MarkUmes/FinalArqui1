# El ingreso público llega al broker. Pedidos también usa el broker para consultar Productos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker
  namespace: tienda
spec:
  podSelector:
    matchLabels:
      app: broker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app: pedidos
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servicios-internos
  namespace: tienda
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [productos, pedidos]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: broker
      ports:
        - port: 3001
          protocol: TCP
        - port: 3002
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql
  namespace: tienda
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [broker, productos, pedidos]
      ports:
        - port: 3306
          protocol: TCP
