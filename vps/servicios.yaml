apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: broker
          image: localhost/finalarqui1/broker:v1
          # Las imágenes se importan en el containerd del VPS.
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "mysql"
            - name: DB_NAME
              value: "broker"
            - name: DB_USER
              value: "broker"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-secretos
                  key: BROKER_DB_PASSWORD
            - name: JWT_SECRETO
              valueFrom:
                secretKeyRef:
                  name: tienda-secretos
                  key: JWT_SECRETO
            - name: SERVICIO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tienda-secretos
                  key: SERVICIO_TOKEN
            - name: ADMIN_USUARIO
              valueFrom:
                secretKeyRef:
                  name: tienda-secretos
                  key: ADMIN_USUARIO
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-secretos
                  key: ADMIN_PASSWORD
            - name: PRODUCTOS_URL
              value: "http://productos:3001"
            - name: PEDIDOS_URL
              value: "http://pedidos:3002"
          readinessProbe:
            httpGet:
              path: /salud
              port: 3000
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: tienda
spec:
  selector:
    app: broker
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
