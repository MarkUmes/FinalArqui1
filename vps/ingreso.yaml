apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-tienda
  namespace: tienda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: api-tienda.soymythpick.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: broker
                port:
                  number: 3000
  tls:
    - hosts:
        - api-tienda.soymythpick.com
      secretName: api-tienda-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: force-https
  namespace: tienda
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-tienda-http
  namespace: tienda
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: tienda-force-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api-tienda.soymythpick.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: broker
                port:
                  number: 3000
